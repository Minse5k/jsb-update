<html layout:decorate="~{layout}">
<head>
    <title th:text="|${answer.id}번 답변 수정|"></title>
</head>

<div layout:fragment="content" class="container">
    <h5 class="my-3 border-bottom pb-2">답변 수정</h5>
    <form method="post" th:action th:object="${form}">
        <input type="hidden" name="_method" value="PUT">
        <div th:replace="~{form_errors :: formErrorsFragment}"></div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea th:field="*{content}" class="form-control" rows="10" autofocus data-markdown-editor></textarea>
        </div>
        <input type="submit" value="수정하기" class="btn btn-primary my-2">
        <a th:href="@{|/questions/${answer.question.id}|}" class="btn btn-secondary my-2">취소</a>
    </form>
</div>
</html>

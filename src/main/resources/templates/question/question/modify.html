<html layout:decorate="~{layout}">
<head>
    <title th:text="|${question.id}번 질문 수정|"></title>
</head>

<div layout:fragment="content" class="container">
    <h5 class="my-3 border-bottom pb-2">질문 수정</h5>
    <form method="post" th:action th:object="${form}">
        <!-- HTML 폼은 GET/POST 만 보낼 수 있다. _method=PUT 숨은 칸 → 서버에서 PUT 요청으로 바뀐다. (hiddenmethod 필터) -->
        <input type="hidden" name="_method" value="PUT">
        <div th:replace="~{form_errors :: formErrorsFragment}"></div>
        <div class="mb-3">
            <label for="category" class="form-label">카테고리</label>
            <!-- th:field 는 select 에서도 form.category 와 같은 값의 option 에 selected 를 붙여 준다. -->
            <select th:field="*{category}" class="form-select">
                <option th:each="c : ${categories}" th:value="${c.code}" th:text="${c.name}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="subject" class="form-label">제목</label>
            <input type="text" th:field="*{subject}" class="form-control" autofocus>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea th:field="*{content}" class="form-control" rows="10"></textarea>
        </div>
        <input type="submit" value="수정하기" class="btn btn-primary my-2">
        <a th:href="@{|/questions/${question.id}|}" class="btn btn-secondary my-2">취소</a>
    </form>
</div>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- static 폴더 아래 파일은 그 경로 그대로 주소가 된다: static/resource/style.css → /resource/style.css -->
    <link rel="stylesheet" th:href="@{/resource/style.css}">
    <title>질문 상세</title>
</head>
<body>
<h1 th:text="${question.subject}"></h1>
<!-- white-space: pre-line : 내용의 줄바꿈(엔터)을 화면에서도 줄바꿈으로 보여 준다. -->
<div style="white-space: pre-line;" th:text="${question.content}"></div>

<!-- question.answers 는 LAZY 라서 여기서 처음 읽을 때 SELECT * FROM answer WHERE question_id = ? 가 실행된다. -->
<h5 th:text="|${#lists.size(question.answers)}개의 답변이 있습니다.|"></h5>
<ul>
    <li th:each="answer : ${question.answers}">
        <div style="white-space: pre-line;" th:text="${answer.content}"></div>
        <div th:text="${#temporals.format(answer.createDate, 'yyyy-MM-dd HH:mm')}"></div>
    </li>
</ul>

<!-- 답변 작성 폼 : 전송하면 POST /questions/{id}/answers 요청이 발생한다. -->
<form th:action="@{|/questions/${question.id}/answers|}" method="post">
    <textarea name="content" rows="10"></textarea>
    <input type="submit" value="답변등록">
</form>
</body>
</html>

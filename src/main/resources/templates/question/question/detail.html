<html layout:decorate="~{layout}">
<!-- layout.html 을 틀로 쓰고, 아래 layout:fragment="content" 부분만 끼워 넣는다. -->
<head>
    <title>질문 상세</title> <!-- layout.html 의 title-pattern 에 의해 "질문 상세 | SBB" 가 된다. -->
</head>

<div layout:fragment="content" class="container my-3">
    <!-- 질문 -->
    <h2 class="border-bottom py-2" th:text="${question.subject}"></h2>
    <div class="card my-3">
        <div class="card-body">
            <!-- 마크다운 → HTML 로 바꾼 결과를 th:utext 로 출력 (th:text 는 태그를 글자 그대로 보여 준다) -->
            <!-- 줄바꿈·목록은 마크다운이 HTML 로 처리하므로 pre-line 은 더 이상 필요 없다. -->
            <div class="card-text" th:utext="${commonUtil.markdown(question.content)}"></div>
            <div class="d-flex justify-content-end">
                <!-- 수정한 적이 있을 때만 (처음 저장 때는 수정일시 = 작성일시) -->
                <div th:if="${question.modifyDate.isAfter(question.createDate)}" class="badge bg-light text-dark p-2 text-start mx-3">
                    <div class="mb-2">modified at</div>
                    <div th:text="${#temporals.format(question.modifyDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
                <div class="badge bg-light text-dark p-2 text-start">
                    <div class="mb-2" th:text="${question.author?.username}"></div>
                    <div th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
            <div class="my-3">
                <!-- 추천 : POST /questions/{id}/vote (로그인하지 않았으면 로그인 화면으로) -->
                <a th:href="@{|/questions/${question.id}/vote|}" method="POST"
                   onclick="return confirm('정말로 추천하시겠습니까?');"
                   class="btn btn-sm btn-outline-secondary">
                    추천
                    <span class="badge rounded-pill bg-success" th:text="${#sets.size(question.voters)}"></span>
                </a>
                <!-- 로그인했고, 내가 쓴 질문일 때만 수정 버튼 (#authentication.name = 로그인한 아이디) -->
                <a th:href="@{|/questions/${question.id}/modify|}" class="btn btn-sm btn-outline-secondary"
                   sec:authorize="isAuthenticated()"
                   th:if="${question.author != null and #authentication.name == question.author.username}">수정</a>
                <!-- method="DELETE" : global.js 가 클릭을 가로채 DELETE 요청(+CSRF 토큰)으로 보낸다. -->
                <!-- onclick 이 false 를 돌려주면(확인 창에서 취소) 보내지 않는다. -->
                <a th:href="@{|/questions/${question.id}|}" method="DELETE"
                   onclick="return confirm('정말로 삭제하시겠습니까?');"
                   class="btn btn-sm btn-outline-secondary"
                   sec:authorize="isAuthenticated()"
                   th:if="${question.author != null and #authentication.name == question.author.username}">삭제</a>
            </div>
        </div>
    </div>

    <!-- 답변 개수 : 전체 답변을 읽지 않고 count 쿼리로 센 값 -->
    <h5 class="border-bottom my-3 py-2" th:text="|${answerPaging.totalElements}개의 답변이 있습니다.|"></h5>

    <!-- 답변 반복 : 이번 페이지의 답변 10개만 (최신순) -->
    <div class="card my-3" th:each="answer : ${answerPaging}">
        <!-- 앵커 : 주소 끝에 #answer_3 을 붙이면 브라우저가 이 위치로 스크롤한다. -->
        <a th:id="|answer_${answer.id}|"></a>
        <div class="card-body">
            <div class="card-text" th:utext="${commonUtil.markdown(answer.content)}"></div>
            <div class="d-flex justify-content-end">
                <div th:if="${answer.modifyDate.isAfter(answer.createDate)}" class="badge bg-light text-dark p-2 text-start mx-3">
                    <div class="mb-2">modified at</div>
                    <div th:text="${#temporals.format(answer.modifyDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
                <div class="badge bg-light text-dark p-2 text-start">
                    <div class="mb-2" th:text="${answer.author?.username}"></div>
                    <div th:text="${#temporals.format(answer.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
            <div class="my-3">
                <a th:href="@{|/questions/${question.id}/answers/${answer.id}/vote|}" method="POST"
                   onclick="return confirm('정말로 추천하시겠습니까?');"
                   class="btn btn-sm btn-outline-secondary">
                    추천
                    <span class="badge rounded-pill bg-success" th:text="${#sets.size(answer.voters)}"></span>
                </a>
                <a th:href="@{|/questions/${question.id}/answers/${answer.id}/modify|}" class="btn btn-sm btn-outline-secondary"
                   sec:authorize="isAuthenticated()"
                   th:if="${answer.author != null and #authentication.name == answer.author.username}">수정</a>
                <a th:href="@{|/questions/${question.id}/answers/${answer.id}|}" method="DELETE"
                   onclick="return confirm('정말로 삭제하시겠습니까?');"
                   class="btn btn-sm btn-outline-secondary"
                   sec:authorize="isAuthenticated()"
                   th:if="${answer.author != null and #authentication.name == answer.author.username}">삭제</a>
            </div>
        </div>
    </div>

    <!-- 답변 페이지 이동 (답변이 한 페이지를 넘을 때만) -->
    <nav th:if="${answerPaging.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!answerPaging.hasPrevious} ? 'disabled'">
                <a class="page-link" th:href="@{|/questions/${question.id}|(ap=${answerPaging.number - 1})}">이전</a>
            </li>
            <li th:each="p : ${#numbers.sequence(0, answerPaging.totalPages - 1)}"
                th:if="${p >= answerPaging.number - 5 and p <= answerPaging.number + 5}"
                th:classappend="${p == answerPaging.number} ? 'active'" class="page-item">
                <a class="page-link" th:href="@{|/questions/${question.id}|(ap=${p})}" th:text="${p + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${!answerPaging.hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{|/questions/${question.id}|(ap=${answerPaging.number + 1})}">다음</a>
            </li>
        </ul>
    </nav>

    <!-- 답변 작성 폼 : 전송하면 POST /questions/{id}/answers 요청이 발생한다. -->
    <form th:action="@{|/questions/${question.id}/answers|}" method="post" class="my-3" th:object="${answerForm}">
        <div th:replace="~{form_errors :: formErrorsFragment}"></div>
        <!-- 로그인하지 않았으면 입력칸을 비활성화하고 안내 문구 -->
        <textarea sec:authorize="isAnonymous()" disabled rows="10" class="form-control"
                  placeholder="로그인 후 답변을 등록할 수 있습니다."></textarea>
        <textarea sec:authorize="isAuthenticated()" th:field="*{content}" rows="10" class="form-control"></textarea>
        <input type="submit" value="답변등록" class="btn btn-primary my-2">
    </form>
</div>
</html>

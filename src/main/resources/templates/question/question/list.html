<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>질문 목록</title>
</head>
<body>
<h1>질문 목록</h1>

<table>
    <thead>
    <tr>
        <th>번호</th>
        <th>제목</th>
        <th>작성일시</th>
    </tr>
    </thead>
    <tbody>
    <!-- loop : 반복 상태 변수. loop.count 는 1부터 세는 순번 -->
    <tr th:each="question, loop : ${questions}">
        <td th:text="${loop.count}"></td>
        <td th:text="${question.subject}"></td>
        <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>

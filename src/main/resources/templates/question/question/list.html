<html layout:decorate="~{layout}">
<!-- layout.html 을 틀로 쓰고, 아래 layout:fragment="content" 부분만 끼워 넣는다. -->
<head>
    <title>질문 목록</title> <!-- layout.html 의 title-pattern 에 의해 "질문 목록 | SBB" 가 된다. -->
</head>

<div layout:fragment="content" class="container my-3">
    <div class="row my-3">
        <div class="col-6">
            <a th:href="@{/questions/write}" class="btn btn-primary">질문 등록하기</a>
        </div>
        <div class="col-6">
            <!-- 검색 폼 : 전송하면 GET /questions?kw=검색어 (폼은 URL 생성기). page 가 없으므로 첫 페이지부터 -->
            <form th:action="@{/questions}" method="get" class="input-group">
                <input type="text" name="kw" th:value="${kw}" class="form-control" placeholder="검색어">
                <button type="submit" class="btn btn-outline-secondary">찾기</button>
            </form>
        </div>
    </div>

    <table class="table">
        <thead class="table-dark">
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>글쓴이</th>
            <th>조회</th>
            <th>작성일시</th>
        </tr>
        </thead>
        <tbody>
        <!-- loop : 반복 상태 변수. loop.index 는 0부터 세는 순번 -->
        <tr th:each="question, loop : ${paging}"> <!-- Page 도 반복할 수 있다 (이번 페이지의 질문들) -->
            <!-- 게시물 번호 = 전체 개수 - (현재 페이지 × 페이지 크기) - 이 페이지 안에서의 순번 -->
            <!-- 예) 전체 303개, 1페이지(두 번째 페이지), 첫 줄 → 303 - 10 - 0 = 293 -->
            <td th:text="${paging.totalElements - (paging.number * paging.size) - loop.index}"></td>
            <td>
                <!-- @{...} : URL 을 만드는 문법, |...| : 문자열 안에 변수를 끼워 넣는 문법 -->
                <a th:href="@{|/questions/${question.id}|}" th:text="${question.subject}"></a>
                <!-- 답변이 있을 때만 제목 옆에 빨간 숫자로 답변 개수 -->
                <span class="text-danger small ms-2"
                      th:if="${#lists.size(question.answers) > 0}"
                      th:text="${#lists.size(question.answers)}"></span>
            </td>
            <!-- ?. : author 가 null 이면 오류 없이 빈칸 (14168 16강) -->
            <td th:text="${question.author?.username}"></td>
            <td th:text="${question.viewCount}"></td>
            <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>

    <!-- 페이지 이동 -->
    <!-- @{/questions(page=${...}, kw=${kw})} : /questions?page=값&kw=검색어 → 페이지를 옮겨도 검색어가 유지된다. -->
    <nav th:if="${!paging.isEmpty()}">
        <ul class="pagination justify-content-center">
            <!-- 이전 : 첫 페이지면 비활성화 -->
            <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                <a class="page-link" th:href="@{/questions(page=${paging.number - 1}, kw=${kw})}">이전</a>
            </li>
            <!-- 현재 페이지 앞뒤 5개까지만 번호를 보여 준다. 화면에는 1부터 보이도록 +1 -->
            <li th:each="page : ${#numbers.sequence(0, paging.totalPages - 1)}"
                th:if="${page >= paging.number - 5 and page <= paging.number + 5}"
                th:classappend="${page == paging.number} ? 'active'" class="page-item">
                <a class="page-link" th:href="@{/questions(page=${page}, kw=${kw})}" th:text="${page + 1}"></a>
            </li>
            <!-- 다음 : 마지막 페이지면 비활성화 -->
            <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{/questions(page=${paging.number + 1}, kw=${kw})}">다음</a>
            </li>
        </ul>
    </nav>
</div>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- static 폴더 아래 파일은 그 경로 그대로 주소가 된다: static/resource/style.css → /resource/style.css -->
    <link rel="stylesheet" th:href="@{/resource/style.css}">
    <title>질문 목록</title>
</head>
<body>
<h1>질문 목록</h1>

<table>
    <thead>
    <tr>
        <th>번호</th>
        <th>제목</th>
        <th>작성일시</th>
    </tr>
    </thead>
    <tbody>
    <!-- loop : 반복 상태 변수. loop.count 는 1부터 세는 순번 -->
    <tr th:each="question, loop : ${questions}">
        <td th:text="${loop.count}"></td>
        <td>
            <!-- @{...} : URL 을 만드는 문법, |...| : 문자열 안에 변수를 끼워 넣는 문법 -->
            <a th:href="@{|/questions/${question.id}|}" th:text="${question.subject}"></a>
        </td>
        <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 각 페이지의 <title> 이 $CONTENT_TITLE, 여기의 SBB 가 $LAYOUT_TITLE -->
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">SBB</title>

    <!-- 부트스트랩 (cdnjs) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js" defer></script>

    <!-- 마크다운 편집기 EasyMDE (교재의 SimpleMDE 를 이어서 관리하는 후속 프로젝트, cdnjs 에 없어서 jsDelivr) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.20.0/dist/easymde.min.css">
    <script src="https://cdn.jsdelivr.net/npm/easymde@2.20.0/dist/easymde.min.js" defer></script>
    <!-- 편집기 툴바 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet" th:href="@{/resource/style.css}">

    <!-- CSRF 토큰을 메타 태그로 심어 둔다 → global.js 가 읽어서 POST/PUT/DELETE 폼에 붙인다. -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <!-- a[method="POST|PUT|DELETE"] 를 클릭하면 그 메서드로 요청을 보내 주는 공통 스크립트 -->
    <script th:src="@{/resource/global.js}" defer></script>
    <!-- textarea[data-markdown-editor] 를 마크다운 편집기로 바꾸는 스크립트 -->
    <script th:src="@{/resource/markdown-editor.js}" defer></script>
</head>
<body>

<!-- 내비게이션 바 (templates/navbar.html) -->
<nav th:replace="~{navbar :: navbarFragment}"></nav>

<!-- 각 페이지의 layout:fragment="content" 가 이 자리에 들어온다. -->
<th:block layout:fragment="content"></th:block>

</body>
</html>

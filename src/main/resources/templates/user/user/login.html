<html layout:decorate="~{layout}">
<head>
    <title>로그인</title>
</head>

<div layout:fragment="content" class="container my-3">
    <h4 class="my-3 border-bottom pb-2">로그인</h4>
    <!-- 로그인 실패 시 시큐리티가 /users/login?error 로 돌려보낸다. -->
    <div th:if="${param.error}" class="alert alert-danger">
        아이디 또는 비밀번호를 확인해 주세요.
    </div>
    <!-- 시큐리티는 username, password 라는 이름의 값을 읽는다. th:action 으로 CSRF 토큰 포함 -->
    <form method="post" th:action="@{/users/login}">
        <div class="mb-3">
            <label for="username" class="form-label">아이디</label>
            <input type="text" name="username" id="username" class="form-control" autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" name="password" id="password" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">로그인</button>
        <a th:href="@{/users/password/reset}" class="ms-2">비밀번호를 잊으셨나요?</a>
    </form>
    <!-- 카카오 키가 설정되어 있을 때만 -->
    <div class="mt-4" th:if="${kakaoLoginEnabled}">
        <!-- 시큐리티가 만들어 둔 주소 : 카카오 로그인 화면으로 보내 준다. -->
        <a th:href="@{/oauth2/authorization/kakao}" class="btn btn-warning">카카오로 로그인</a>
    </div>
</div>
</html>

<html layout:decorate="~{layout}">
<head>
    <title>비밀번호 찾기</title>
</head>

<div layout:fragment="content" class="container my-3">
    <h4 class="my-3 border-bottom pb-2">비밀번호 찾기</h4>
    <div th:if="${param.sent}" class="alert alert-success">
        가입된 이메일이라면 임시 비밀번호를 보냈습니다. 메일을 확인한 뒤 로그인해 주세요.
    </div>
    <p class="text-secondary">가입할 때 쓴 이메일로 임시 비밀번호를 보내 드립니다.</p>
    <form method="post" th:action="@{/users/password/reset}" th:object="${form}">
        <div th:replace="~{form_errors :: formErrorsFragment}"></div>
        <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <input type="email" th:field="*{email}" class="form-control" autofocus>
        </div>
        <button type="submit" class="btn btn-primary">임시 비밀번호 받기</button>
    </form>
</div>
</html>

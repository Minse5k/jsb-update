<!-- 내비게이션 바 조각. layout.html 에서 th:replace 로 끼워 넣는다. -->
<nav th:fragment="navbarFragment" class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">SBB</a>
        <!-- 화면이 좁을 때(모바일) 보이는 메뉴 펼치기 버튼. 부트스트랩 JS 가 동작시킨다. -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/questions}">질문 목록</a>
                </li>
            </ul>
            <ul class="navbar-nav mb-2 mb-lg-0">
                <!-- sec:authorize : 조건이 맞을 때만 이 태그를 그린다. (thymeleaf-extras-springsecurity) -->
                <!-- isAnonymous() : 로그인하지 않은 상태 -->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/users/login}">로그인</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/users/join}">회원가입</a>
                </li>
                <!-- isAuthenticated() : 로그인한 상태. sec:authentication="name" 은 로그인한 아이디 -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="nav-link"><span sec:authentication="name"></span>님</span>
                </li>
            </ul>
        </div>
    </div>
</nav>
